<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta id="waynote-apple-bar" name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta id="waynote-color-scheme" name="color-scheme" content="light dark" />
    <meta id="waynote-theme-color" name="theme-color" content="#CFE4FC" />
    <style>
      html, body { background-color: #CFE4FC; }
      html.is-standalone:not(.dark) {
        background-color: #2E7CF6;
        background-image: linear-gradient(180deg, #2E7CF6 0%, #4A90F8 90px, #CFE4FC 180px, #ECF4FF 58%, #F7FAFF 100%);
        background-repeat: no-repeat;
      }
      html.is-standalone:not(.dark) body { background-color: transparent; }
      html.dark, html.dark body { background-color: #080D1B !important; }
    </style>
    <script>
      (function () {
        try {
          var lang = localStorage.getItem('waynote_language');
          var root = document.documentElement;
          if (lang === 'zh-CN') {
            root.lang = 'zh-Hans-CN';
            root.setAttribute('data-lang', 'zh-CN');
          } else if (lang === 'en') {
            root.lang = 'en';
            root.setAttribute('data-lang', 'en');
          } else {
            root.lang = 'zh-Hant-TW';
            root.setAttribute('data-lang', 'zh-TW');
          }

          var mode = localStorage.getItem('sky_travel_theme_mode');
          if (!mode) {
            var legacy = localStorage.getItem('sky_travel_dark_mode');
            if (legacy !== null) mode = JSON.parse(legacy) ? 'dark' : 'light';
          }
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          var isStandalone = (window.navigator && window.navigator.standalone === true) ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

          if (isStandalone) {
            root.classList.add('is-standalone');
            var ua = navigator.userAgent || '';
            var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIOS && window.screen) {
              var sw = window.screen.width;
              var sh = window.screen.height;
              var iw = window.innerWidth;
              var ih = window.innerHeight;
              var isPortrait = iw <= ih;
              var expectedW = isPortrait ? Math.min(sw, sh) : Math.max(sw, sh);
              var expectedH = isPortrait ? Math.max(sw, sh) : Math.min(sw, sh);
              if (Math.abs(iw - expectedW) <= 6) {
                var gap = Math.round(expectedH - ih);
                if (gap > 0 && gap <= 112) {
                  root.style.setProperty('--standalone-bottom-gap', gap + 'px');
                }
              }
            }
          }

          var topTint = isDark ? '#080D1B' : (isStandalone ? '#2E7CF6' : '#CFE4FC');
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          root.style.setProperty('--safe-top-tint', topTint);
          root.style.backgroundColor = topTint;

          var schemeMeta = document.getElementById('waynote-color-scheme');
          if (schemeMeta) schemeMeta.setAttribute('content', isDark ? 'dark' : 'light');

          var themeMeta = document.getElementById('waynote-theme-color');
          if (themeMeta) themeMeta.setAttribute('content', topTint);
        } catch (e) {}
      })();
    </script>
    <title>Waynote — 簡約旅程規劃</title>
    <meta name="description" content="簡約現代的跨裝置旅程規劃工具，整合行程時間軸、AI 路線規劃、即時天氣、開支預算與百寶箱。" />
    <meta property="og:title" content="Waynote — 簡約旅程規劃" />
    <meta property="og:description" content="簡約現代的跨裝置旅程規劃工具，整合行程時間軸、AI 路線規劃、即時天氣、開支預算與百寶箱。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@400;500;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased selection:bg-sky-600 selection:text-white">
    <div id="root" class="min-h-full w-full"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
